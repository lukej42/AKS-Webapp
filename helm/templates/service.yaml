apiVersion: v1
kind: Service
metadata:
  name: {{ include "weatherapp.fullname" . }}
  labels:
    {{- include "weatherapp.labels" . | nindent 4 }}
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: {{ .Values.service.azure.internal | quote }}
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "weatherapp.selectorLabels" . | nindent 4 }}